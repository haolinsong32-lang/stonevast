<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1a1f2b"/>
      <stop offset="60%" stop-color="#0f131b"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd7a8"/>
      <stop offset="45%" stop-color="#f0a35e"/>
      <stop offset="100%" stop-color="#b9631f"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3140"/>
      <stop offset="100%" stop-color="#161a22"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- ambient light -->
  <ellipse cx="512" cy="470" rx="330" ry="300" fill="#f0a35e" opacity="0.10" filter="url(#soft)"/>

  <!-- outer ring -->
  <circle cx="512" cy="470" r="332" fill="none" stroke="#f0a35e" stroke-opacity="0.16" stroke-width="1.5"/>
  <circle cx="512" cy="470" r="300" fill="none" stroke="#2b3140" stroke-width="1"/>

  <!-- rock slab -->
  <polygon points="512,196 664,262 742,404 716,566 596,702 452,740 322,650 268,494 306,336 396,240"
           fill="url(#rock)" stroke="#3a4152" stroke-width="2"/>

  <!-- cut plane -->
  <polygon points="512,232 640,292 700,410 676,540 574,652 456,682 352,608 310,486 342,354 420,272"
           fill="#12161e" stroke="#252b38" stroke-width="1.5"/>

  <!-- ore veins -->
  <g fill="none" stroke="url(#vein)" stroke-linecap="round" filter="url(#glow)">
    <path d="M372 520 L448 470 L520 500 L596 436" stroke-width="5" opacity="0.95"/>
    <path d="M424 600 L472 552 L556 574 L628 508" stroke-width="3" opacity="0.7"/>
    <path d="M400 420 L470 392 L534 418" stroke-width="2.5" opacity="0.55"/>
    <path d="M470 392 L448 470" stroke-width="2" opacity="0.4"/>
    <path d="M556 574 L574 652" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- chips / facets -->
  <g stroke="#f0a35e" stroke-opacity="0.35" fill="none" stroke-width="1">
    <path d="M512,232 L512,318 L596,352"/>
    <path d="M342,354 L420,390 L400,470"/>
    <path d="M628,508 L676,540"/>
  </g>

  <!-- label -->
  <text x="512" y="836" text-anchor="middle" fill="#e9edf4" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="6">STONEVAST GENESIS</text>
  <text x="512" y="876" text-anchor="middle" fill="#8b93a7" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" letter-spacing="4">REAL HASHRATE · REAL REVENUE</text>

  <!-- number -->
  <text x="512" y="936" text-anchor="middle" fill="#f0a35e" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="800" letter-spacing="8">#001</text>

  <!-- corner marks -->
  <g stroke="#f0a35e" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M64 128 L64 64 L128 64"/>
    <path d="M896 64 L960 64 L960 128"/>
    <path d="M64 896 L64 960 L128 960"/>
    <path d="M960 896 L960 960 L896 960"/>
  </g>
</svg>
