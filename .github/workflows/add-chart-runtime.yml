name: Add verified Chart.js runtime
on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/add-chart-runtime.yml
permissions:
  contents: write
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Download and verify Chart.js
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --silent --show-error --retry 3 \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js \
            --output assets/chart.umd.min.js
          echo "0e2326c6868072bec1592760c6729043caeea2960a2b46cee6a2192aac6abff0  assets/chart.umd.min.js" | sha256sum --check
          test "$(git hash-object assets/chart.umd.min.js)" = "9a07c2f45def422fa70b91aa8ae4f0601935246c"
      - name: Commit runtime
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:assets/chart.umd.min.js 2>/dev/null && git diff --quiet -- assets/chart.umd.min.js; then
            echo "Chart runtime already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chart.umd.min.js
          git commit -m "feat: add chart runtime for Pages"
          git push origin gh-pages
